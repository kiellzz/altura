spring.application.name=altura-api
# Carrega credenciais locais sem depender do shell. Variáveis do sistema e da
# hospedagem continuam tendo precedência sobre estes arquivos.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
spring.sql.init.mode=never

app.security.jwt.issuer=${JWT_ISSUER:altura-api}
app.security.jwt.secret=${JWT_SECRET:altura-dev-secret-change-before-production-2026}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Neon Object Storage (S3 compativel). O backend continua iniciando sem estas
# variaveis, mas publicacoes com imagem ficam indisponiveis.
app.storage.endpoint=${AWS_ENDPOINT_URL_S3:}
app.storage.region=${AWS_REGION:us-east-2}
app.storage.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.bucket=${STORAGE_BUCKET:}
app.storage.signed-url-minutes=${STORAGE_SIGNED_URL_MINUTES:60}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-message=never
server.error.include-stacktrace=never

# Altura Intelligence - Integracao Gemini (servidor)
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:90}
